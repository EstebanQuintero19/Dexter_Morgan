services:
  - type: web
    name: dexter
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /dexter_assets/*
        name: Cache-Control
        value: public, max-age=604800
